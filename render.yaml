databases:
  - name: dabbatiffin-db
    plan: free
    databaseName: dabbatiffin
    user: dabbatiffin

services:
  - type: web
    name: dabbatiffin-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dabbatiffin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: "43200"
      - key: CORS_ORIGINS
        value: https://dabbatiffin.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: dabbatiffin
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: (pip install -r ../scripts/requirements.txt && python3 ../scripts/fetch_dish_images.py) || true; npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://dabbatiffin-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
